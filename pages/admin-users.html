<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users – Kwale High School SMS</title>
    <meta name="description" content="Manage system users and access credentials.">
    <link rel="stylesheet" href="../dashboard.css">
</head>
<body>

<div id="khs-toast"></div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main-wrapper" id="main-wrapper">

    <header class="topbar">
        <button class="topbar-toggle" id="sidebar-toggle">☰</button>
        <span class="topbar-title">System Users</span>
        <div class="topbar-actions">
            <div class="user-pill">
                <div class="user-avatar-sm" id="user-avatar">AD</div>
                <div class="user-info-sm">
                    <span class="u-name" id="user-name">Admin</span>
                    <span class="u-role" id="user-role">Administrator</span>
                </div>
            </div>
        </div>
    </header>

    <main class="page-content">

        <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:24px;">
            <div>
                <h2>User Management</h2>
                <p>Manage login credentials and system access roles</p>
            </div>
            <button class="btn btn-primary" onclick="document.getElementById('addUserModal').classList.add('active')">➕ Add User</button>
        </div>

        <div class="page-toolbar">
            <div class="search-bar" style="flex:1;max-width:420px;">
                <span>🔍</span>
                <input type="text" id="search-input" placeholder="Search by username..." autocomplete="off">
            </div>
        </div>

        <div class="card" style="padding:0;overflow:hidden;">
            <div class="table-scroll">
                <table class="data-table" style="min-width:600px;">
                    <thead>
                        <tr>
                            <th>Username</th>
                            <th>Role</th>
                            <th>Status</th>
                            <th>Linked Profile</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        <tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted);">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Modals -->
        <div class="modal-overlay" id="addUserModal">
            <div class="modal">
                <button class="modal-close" onclick="document.getElementById('addUserModal').classList.remove('active')">&times;</button>
                <h3 style="margin-bottom:16px;">Add New User</h3>
                <form id="addUserForm" onsubmit="submitAddUser(event)">
                    <div style="margin-bottom:12px;">
                        <label>Username</label>
                        <input type="text" id="addUsername" required style="width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:4px;">
                    </div>
                    <div style="margin-bottom:12px;">
                        <label>Password</label>
                        <input type="password" id="addPassword" required style="width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:4px;">
                    </div>
                    <div style="margin-bottom:12px;">
                        <label>Role</label>
                        <select id="addRole" required style="width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:4px;" onchange="toggleRoleFields()">
                            <option value="ADMIN">Admin</option>
                            <option value="PRINCIPAL">Principal</option>
                            <option value="DEPUTY_PRINCIPAL">Deputy Principal</option>
                            <option value="HOD">HOD</option>
                            <option value="TEACHER">Teacher</option>
                            <option value="ACCOUNTANT">Accountant</option>
                            <option value="PARENT">Parent</option>
                            <option value="STUDENT">Student</option>
                        </select>
                    </div>
                    <div id="parentFields" style="display:none;margin-bottom:12px;">
                        <input type="text" id="addStudentAdm" placeholder="Student Admission Number" style="width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:4px;">
                        <input type="text" id="addParentFirst" placeholder="Parent First Name" style="width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:4px;">
                        <input type="text" id="addParentLast" placeholder="Parent Last Name" style="width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:4px;">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;">Create User</button>
                </form>
            </div>
        </div>

        <div class="modal-overlay" id="resetModal">
            <div class="modal">
                <button class="modal-close" onclick="document.getElementById('resetModal').classList.remove('active')">&times;</button>
                <h3 style="margin-bottom:16px;">Reset Password</h3>
                <form id="resetForm" onsubmit="submitResetPassword(event)">
                    <input type="hidden" id="resetUserId">
                    <div style="margin-bottom:12px;">
                        <label>New Password</label>
                        <input type="password" id="resetPassword" required minlength="6" style="width:100%;padding:8px;margin-top:4px;border:1px solid #ccc;border-radius:4px;">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width:100%;">Save Password</button>
                </form>
            </div>
        </div>
    </main>
</div>

<script src="../auth.js"></script>
<script src="../dashboard.js"></script>
<script>
const user = requireAuth(['admin', 'principal', 'deputy_principal']);
if (user) populateTopBar(user);

let allUsers = [];

async function loadUsers() {
    allUsers = await apiFetch('/api/users');
    renderUsers();
}

function renderUsers() {
    const tbody = document.getElementById('user-table-body');
    const term = document.getElementById('search-input').value.toLowerCase();
    
    if (!allUsers) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--danger);">Failed to load users</td></tr>';
        return;
    }

    const filtered = allUsers.filter(u => u.username.toLowerCase().includes(term));

    if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted);">No users found</td></tr>';
        return;
    }

    const roleMap = {
        'ADMIN': 'Admin',
        'PRINCIPAL': 'Principal',
        'DEPUTY_PRINCIPAL': 'Deputy Principal',
        'HOD': 'HOD',
        'TEACHER': 'Teacher',
        'ACCOUNTANT': 'Accountant',
        'PARENT': 'Parent',
        'STUDENT': 'Student'
    };
    
    const roleClsMap = {
        'ADMIN': 'amber',
        'PRINCIPAL': 'blue',
        'DEPUTY_PRINCIPAL': 'purple',
        'HOD': 'green',
        'TEACHER': 'blue',
        'ACCOUNTANT': 'red',
        'PARENT': 'green',
        'STUDENT': 'gray'
    };

    tbody.innerHTML = filtered.map(u => {
        const roleLabel = roleMap[u.role] || u.role;
        const roleCls = roleClsMap[u.role] || '';
        const statusCls = u.is_active ? 'active' : 'inactive';
        const statusLbl = u.is_active ? 'Active' : 'Disabled';
        
        let linked = '<span style="color:var(--text-muted)">None</span>';
        if (u.staff_id) linked = 'Staff ID: ' + u.staff_id;
        else if (u.student_id) linked = 'Student ID: ' + u.student_id;
        else if (u.parent_id) linked = 'Parent ID: ' + u.parent_id;

        return `
            <tr>
                <td style="font-weight:600;color:var(--dark);">${u.username}</td>
                <td><span class="tag ${roleCls}">${roleLabel}</span></td>
                <td><span class="badge ${statusCls}">${statusLbl}</span></td>
                <td style="font-size:12px;">${linked}</td>
                <td>
                    <button class="btn btn-outline btn-sm" onclick="openResetModal(${u.id})">Reset Password</button>
                </td>
            </tr>
        `;
    }).join('');
}

document.getElementById('search-input').addEventListener('input', renderUsers);

function toggleRoleFields() {
    const role = document.getElementById('addRole').value;
    document.getElementById('parentFields').style.display = (role === 'PARENT' || role === 'parent') ? 'block' : 'none';
}

function openResetModal(userId) {
    document.getElementById('resetUserId').value = userId;
    document.getElementById('resetPassword').value = '';
    document.getElementById('resetModal').classList.add('active');
}

async function submitAddUser(e) {
    e.preventDefault();
    const payload = {
        username: document.getElementById('addUsername').value,
        password: document.getElementById('addPassword').value,
        role: document.getElementById('addRole').value
    };
    if(payload.role === 'PARENT' || payload.role === 'parent') {
        payload.role = 'parent';
        payload.student_admission_number = document.getElementById('addStudentAdm').value;
        payload.parent_first_name = document.getElementById('addParentFirst').value;
        payload.parent_last_name = document.getElementById('addParentLast').value;
    }
    try {
        const res = await apiFetch('/api/users', {
            method: 'POST',
            body: payload
        });
        if(res) {
            document.getElementById('addUserModal').classList.remove('active');
            loadUsers();
        }
    } catch(err) {
        alert('Network error');
    }
}

async function submitResetPassword(e) {
    e.preventDefault();
    const userId = document.getElementById('resetUserId').value;
    const pwd = document.getElementById('resetPassword').value;
    try {
        const res = await apiFetch('/api/users/' + userId + '/reset-password', {
            method: 'PATCH',
            body: {password: pwd}
        });
        if(res) {
            document.getElementById('resetModal').classList.remove('active');
            alert('Password reset successfully');
        }
    } catch(err) {
        alert('Network error');
    }
}

loadUsers();
</script>
</body>
</html>
