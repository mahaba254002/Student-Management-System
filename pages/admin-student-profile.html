<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile – Kwale High School</title>
    <link rel="stylesheet" href="../dashboard.css">
</head>
<body>

<div id="khs-toast"></div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main-wrapper" id="main-wrapper">

    <header class="topbar">
        <button class="topbar-toggle" id="sidebar-toggle">☰</button>
        <span class="topbar-title">Student Profile</span>
        <div class="topbar-actions">
            <div class="user-pill">
                <div class="user-avatar-sm" id="user-avatar">AD</div>
                <div class="user-info-sm">
                    <span class="u-name" id="user-name">Admin</span>
                    <span class="u-role" id="user-role">Administrator</span>
                </div>
            </div>
        </div>
    </header>

    <main class="page-content">

        <div class="page-header" style="margin-bottom:24px;">
            <a href="admin-students.html" class="btn btn-outline btn-sm" style="margin-bottom:14px;">← Back to Students</a>
        </div>

        <div id="profile-container">
            <div class="empty-state"><div class="es-icon">🎓</div><div class="es-text">Loading student profile...</div></div>
        </div>

    </main>
</div>

<script src="../auth.js"></script>
<script src="../dashboard.js"></script>
<script>
const user = requireAuth(['admin', 'principal', 'deputy_principal', 'hod', 'teacher']);
if (user) populateTopBar(user);

const urlParams = new URLSearchParams(window.location.search);
const studentId = urlParams.get('id');

async function loadProfile() {
    const container = document.getElementById('profile-container');
    if (!studentId) {
        container.innerHTML = '<div class="empty-state"><div class="es-icon">❌</div><div class="es-text">No student ID provided</div></div>';
        return;
    }

    // Using REST endpoint to fetch student details
    const studentData = await apiFetch(`/api/students/${studentId}`);

    if (!studentData || studentData.detail === 'Student not found') {
        container.innerHTML = '<div class="empty-state"><div class="es-icon">❌</div><div class="es-text">Student not found</div></div>';
        return;
    }

    const s = studentData;
    const fullName = [s.first_name, s.middle_name, s.last_name].filter(Boolean).join(' ');
    const initials = ((s.first_name ? s.first_name[0] : '') + (s.last_name ? s.last_name[0] : 'S')).toUpperCase() || 'ST';
    const statusCls = s.status === 'ACTIVE' ? 'active' : 'inactive';

    container.innerHTML = `
        <div class="card" style="margin-bottom:20px;">
            <div style="display:flex; gap:24px; align-items:center;">
                <div class="avatar-xl">${initials}</div>
                <div style="flex:1;">
                    <div style="display:flex; align-items:center; gap:12px; margin-bottom:4px;">
                        <h2 style="font-size:24px; font-weight:700; color:var(--dark); margin:0;">${fullName}</h2>
                        <span class="badge ${statusCls}">${s.status}</span>
                    </div>
                    <div style="font-size:14px; color:var(--text-muted); font-family:monospace;">
                        ${s.admission_number || 'No Admission Number'}
                    </div>
                </div>
                <div>
                    <button class="btn btn-primary">Edit Profile</button>
                </div>
            </div>
        </div>

        <div class="grid-2">
            <div class="card">
                <div class="card-header"><span class="card-title">Academic Info</span></div>
                <div class="info-row"><span class="ir-label">Current Class</span><span class="ir-value">${s.class_name || 'Not Enrolled'}</span></div>
                <div class="info-row"><span class="ir-label">Form Level</span><span class="ir-value">${s.class_level ? 'Form ' + s.class_level : 'N/A'}</span></div>
                <div class="info-row"><span class="ir-label">Enrollment Date</span><span class="ir-value">${s.created_at ? new Date(s.created_at).toLocaleDateString() : 'N/A'}</span></div>
            </div>

            <div class="card">
                <div class="card-header"><span class="card-title">Boarding & Personal</span></div>
                <div class="info-row"><span class="ir-label">Dormitory</span><span class="ir-value">${s.dormitory_name || 'Day Scholar'}</span></div>
                <div class="info-row"><span class="ir-label">Gender</span><span class="ir-value">${s.gender || 'MALE'}</span></div>
                <div class="info-row"><span class="ir-label">Date of Birth</span><span class="ir-value">${s.date_of_birth || 'N/A'}</span></div>
            </div>
            
            <div class="card" style="grid-column: 1 / -1;">
                <div class="card-header"><span class="card-title">Recent Fee Payments</span></div>
                <div class="table-scroll">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Amount (KES)</th>
                                <th>Method</th>
                                <th>Reference</th>
                            </tr>
                        </thead>
                        <tbody id="fees-body">
                            <tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted);">Loading payments...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    `;

    // Load fees
    const feesData = await apiFetch(`/api/finance/fees?student_id=${studentId}&limit=5`);
    
    const feesBody = document.getElementById('fees-body');
    if (!feesData || !feesData.length) {
        feesBody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted);">No payments recorded</td></tr>';
    } else {
        feesBody.innerHTML = feesData.map(f => `
            <tr>
                <td>${f.payment_date ? new Date(f.payment_date).toLocaleDateString() : '—'}</td>
                <td style="color:var(--green-dark);font-weight:700;">${Number(f.amount).toLocaleString()}</td>
                <td><span class="tag">${f.payment_method || 'CASH'}</span></td>
                <td style="font-family:monospace;font-size:11px;">${f.reference_number || f.reference_no || '—'}</td>
            </tr>
        `).join('');
    }
}

loadProfile();
</script>
</body>
</html>
