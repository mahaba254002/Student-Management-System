<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subjects – Kwale High School SMS</title>
    <meta name="description" content="View and manage school subjects.">
    <link rel="stylesheet" href="../dashboard.css">
</head>
<body>

<div id="khs-toast"></div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<aside class="sidebar" id="sidebar"></aside>

<div class="main-wrapper" id="main-wrapper">

    <header class="topbar">
        <button class="topbar-toggle" id="sidebar-toggle">☰</button>
        <span class="topbar-title">Subjects</span>
        <div class="topbar-actions">
            <div class="user-pill">
                <div class="user-avatar-sm" id="user-avatar">AD</div>
                <div class="user-info-sm">
                    <span class="u-name" id="user-name">Admin</span>
                    <span class="u-role" id="user-role">Administrator</span>
                </div>
            </div>
        </div>
    </header>

    <main class="page-content">

        <div class="page-header" style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:12px;margin-bottom:24px;">
            <div>
                <h2>Subjects</h2>
                <p>Manage school curriculum and subject departments</p>
            </div>
            <button class="btn btn-primary" onclick="alert('Feature coming soon')">➕ Add Subject</button>
        </div>

        <div class="card" style="padding:0;overflow:hidden;">
            <div class="table-scroll">
                <table class="data-table" style="min-width:600px;">
                    <thead>
                        <tr>
                            <th>Subject Code</th>
                            <th>Name</th>
                            <th>Department</th>
                            <th>Type</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="subject-table-body">
                        <tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted);">Loading…</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<script src="../auth.js"></script>
<script src="../dashboard.js"></script>
<script>
const user = requireAuth(['admin', 'principal', 'deputy_principal']);
if (user) populateTopBar(user);

async function loadSubjects() {
    const subjects = await apiFetch('/api/subjects');
    const tbody = document.getElementById('subject-table-body');
    
    if (!subjects) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--danger);">Failed to load subjects</td></tr>';
        return;
    }

    if (!subjects.length) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:24px;color:var(--text-muted);">No subjects found</td></tr>';
        return;
    }

    tbody.innerHTML = subjects.map(s => {
        const typeCls = s.is_compulsory ? 'active' : 'leave';
        const typeLbl = s.is_compulsory ? 'Compulsory' : 'Elective';
        return `
            <tr>
                <td style="font-family:monospace;font-weight:600;color:var(--gray);">${s.code}</td>
                <td style="font-weight:600;color:var(--dark);">${s.name}</td>
                <td><span class="tag">${s.department || 'General'}</span></td>
                <td><span class="badge ${typeCls}">${typeLbl}</span></td>
                <td>
                    <button class="btn btn-outline btn-sm">Edit</button>
                </td>
            </tr>
        `;
    }).join('');
}

loadSubjects();
</script>
</body>
</html>
